<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pencil preview</title>
  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0d12; color: #e6e9f2; overscroll-behavior: none; }
    header {
      position: sticky; top: 0; z-index: 1; display: flex; gap: 16px;
      align-items: center; min-height: 62px;
      padding: max(12px, env(safe-area-inset-top)) 16px 12px;
      background: #151923;
      border-bottom: 1px solid #2b3242;
    }
    .titles { min-width: 0; flex: 1; }
    #file { font-size: 13px; color: #8e98ad; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #frame { font-size: 15px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    button {
      min-width: 44px; min-height: 44px; border: 1px solid #3a4357;
      border-radius: 9px; padding: 7px 11px;
      color: #dfe5f2; background: #222838; cursor: pointer;
      touch-action: manipulation;
    }
    button:focus-visible { outline: 2px solid #82a2ff; outline-offset: 2px; }
    button.active { color: white; border-color: #638cff; background: #315fda; }
    button:disabled { opacity: .35; cursor: default; }
    .workspace { height: calc(100vh - 62px); display: flex; min-height: 0; }
    .frame-panel {
      display: none; width: 280px; flex: 0 0 280px; min-height: 0;
      background: #11151e; border-right: 1px solid #2b3242;
    }
    .frame-list-title {
      padding: 16px 16px 10px; color: #8e98ad; font-size: 12px;
      font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    }
    #frame-list {
      height: calc(100% - 42px); margin: 0; padding: 0 10px 16px;
      list-style: none; overflow-y: auto; overscroll-behavior: contain;
    }
    #frame-list li + li { margin-top: 4px; }
    #frame-list button {
      display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 8px;
      align-items: center; width: 100%; min-height: 40px; padding: 7px 10px;
      border-color: transparent; background: transparent; text-align: left;
    }
    #frame-list button:hover { background: #1b2130; }
    #frame-list button[aria-current="true"] {
      color: #fff; border-color: #527bf0; background: #284da8;
    }
    .frame-number { color: #78849b; font-size: 12px; font-variant-numeric: tabular-nums; }
    #frame-list button[aria-current="true"] .frame-number { color: #cdd9ff; }
    .frame-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    main {
      height: 100%; min-width: 0; flex: 1; overflow: auto;
      overscroll-behavior: contain; touch-action: none;
    }
    #surface {
      width: max-content; height: max-content; min-width: 100%; min-height: 100%;
      display: flex; align-items: center; justify-content: center;
      padding: 24px 24px 92px;
    }
    img { display: block; image-rendering: auto; box-shadow: 0 18px 60px #0009; }
    img[hidden] { display: none; }
    main.fit #surface { width: 100%; height: 100%; }
    main.fit img { max-width: 100%; max-height: 100%; object-fit: contain; }
    main.zoomed { cursor: grab; }
    main.zoomed.dragging { cursor: grabbing; user-select: none; }
    main.zoomed img { max-width: none; max-height: none; flex: none; }
    #loading { color: #8e98ad; }
    .navigator {
      position: fixed; z-index: 2; left: 50%; bottom: max(16px, env(safe-area-inset-bottom));
      transform: translateX(-50%); display: flex; align-items: center; gap: 8px;
      padding: 8px; border: 1px solid #3a4357; border-radius: 14px;
      background: #151923e8; box-shadow: 0 12px 36px #0009;
      backdrop-filter: blur(12px);
    }
    .navigator button { font-size: 18px; font-weight: 700; }
    #position { min-width: 66px; text-align: center; color: #b8c0d2; font-variant-numeric: tabular-nums; }
    #gesture-hint {
      position: fixed; right: 16px; bottom: max(22px, env(safe-area-inset-bottom));
      color: #737f96; font-size: 12px; pointer-events: none;
    }
    @media (min-width: 960px) {
      .frame-panel { display: block; }
      .navigator { left: calc(50% + 140px); }
    }
    @media (max-width: 640px) {
      header { gap: 8px; padding-left: 12px; padding-right: 12px; }
      header button { min-width: 40px; min-height: 40px; padding: 6px 9px; }
      #surface { padding: 12px 12px 88px; }
      #gesture-hint { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <header>
    <div class="titles">
      <div id="file">Pencil preview</div>
      <div id="frame" aria-live="polite">연결 중…</div>
    </div>
    <button id="fit" class="active" type="button">Fit</button>
    <button id="actual" type="button">100%</button>
  </header>
  <div class="workspace">
    <aside class="frame-panel" aria-label="프레임 목록">
      <div class="frame-list-title">프레임</div>
      <ol id="frame-list"></ol>
    </aside>
    <main id="stage" class="fit">
      <div id="surface">
        <div id="loading">첫 프레임을 기다리는 중…</div>
        <img id="preview" alt="Pencil frame" draggable="false" hidden>
      </div>
    </main>
  </div>
  <nav class="navigator" aria-label="프레임 이동">
    <button id="previous" type="button" aria-label="이전 프레임" disabled>↑</button>
    <span id="position" aria-live="polite">– / –</span>
    <button id="next" type="button" aria-label="다음 프레임" disabled>↓</button>
    <button id="reload" type="button" aria-label="다시 불러오기">↻</button>
  </nav>
  <div id="gesture-hint">핀치 줌 · 확대 시 드래그 · j/k · ↑/↓ · r</div>
  <script>
    const stage = document.getElementById('stage');
    const image = document.getElementById('preview');
    const loading = document.getElementById('loading');
    const fit = document.getElementById('fit');
    const actual = document.getElementById('actual');
    const previous = document.getElementById('previous');
    const next = document.getElementById('next');
    const reload = document.getElementById('reload');
    const position = document.getElementById('position');
    const frameList = document.getElementById('frame-list');
    let revision = -1;
    let loadingRevision = null;
    let frameNamesKey = '';
    let selectedPosition = 0;
    let requestedImageKey = '';
    let zoomMode = 'fit';
    let zoom = 1;
    let baseWidth = 0;
    let baseHeight = 0;
    let swipeStart = null;
    let dragStart = null;
    let pinchDistance = 0;
    let suppressClick = false;
    let safariGestureZoom = 1;
    const pointers = new Map();

    const EXPORT_SCALE = 2;
    const MIN_ZOOM = .05;
    const MAX_ZOOM = 4;

    function clampZoom(value) {
      return Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, value));
    }

    function currentZoom() {
      if (zoomMode === 'fit' && baseWidth && !image.hidden) {
        return image.getBoundingClientRect().width / baseWidth;
      }
      return zoom;
    }

    function updateModeButtons() {
      fit.classList.toggle('active', zoomMode === 'fit');
      actual.classList.toggle(
        'active', zoomMode === 'zoomed' && Math.abs(zoom - 1) < .001
      );
    }

    function setMode(mode) {
      zoomMode = mode;
      stage.classList.toggle('fit', mode === 'fit');
      stage.classList.toggle('zoomed', mode === 'zoomed');
      stage.classList.remove('dragging');
      if (mode === 'fit') {
        image.style.removeProperty('width');
        image.style.removeProperty('height');
        stage.scrollLeft = 0;
        stage.scrollTop = 0;
      }
      updateModeButtons();
    }
    fit.onclick = () => setMode('fit');
    actual.onclick = () => setZoom(1);
    image.onclick = () => {
      if (suppressClick) return;
      if (zoomMode === 'fit') setZoom(1);
      else setMode('fit');
    };

    function setZoom(nextZoom, focalPoint) {
      if (!baseWidth || !baseHeight || image.hidden) return;
      const focal = focalPoint || {
        x: stage.getBoundingClientRect().left + stage.clientWidth / 2,
        y: stage.getBoundingClientRect().top + stage.clientHeight / 2,
      };
      const before = image.getBoundingClientRect();
      const xRatio = before.width
        ? Math.min(1, Math.max(0, (focal.x - before.left) / before.width))
        : .5;
      const yRatio = before.height
        ? Math.min(1, Math.max(0, (focal.y - before.top) / before.height))
        : .5;

      zoom = clampZoom(nextZoom);
      zoomMode = 'zoomed';
      stage.classList.remove('fit');
      stage.classList.add('zoomed');
      image.style.width = `${baseWidth * zoom}px`;
      image.style.height = `${baseHeight * zoom}px`;
      updateModeButtons();

      const after = image.getBoundingClientRect();
      stage.scrollLeft += after.left + after.width * xRatio - focal.x;
      stage.scrollTop += after.top + after.height * yRatio - focal.y;
    }

    function zoomBy(factor, focalPoint) {
      setZoom(currentZoom() * factor, focalPoint);
    }

    async function send(command, index) {
      try {
        await fetch('command', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(index === undefined ? { command } : { command, index }),
        });
      } catch (_) {
        document.getElementById('frame').textContent = '미리보기 연결 끊김';
      }
    }

    previous.onclick = () => send('previous');
    next.onclick = () => send('next');
    reload.onclick = () => send('reload');

    function renderFrameList(names) {
      frameList.replaceChildren();
      selectedPosition = 0;
      names.forEach((name, index) => {
        const item = document.createElement('li');
        const button = document.createElement('button');
        const number = document.createElement('span');
        const label = document.createElement('span');
        button.type = 'button';
        button.dataset.index = index;
        button.onclick = () => send('select', index);
        number.className = 'frame-number';
        number.textContent = String(index + 1).padStart(2, '0');
        label.className = 'frame-name';
        label.textContent = name;
        button.append(number, label);
        item.append(button);
        frameList.append(item);
      });
    }

    function updateFrameSelection(nextPosition) {
      const changed = selectedPosition !== nextPosition;
      selectedPosition = nextPosition;
      let selectedItem = null;
      frameList.querySelectorAll('button').forEach((button, index) => {
        const current = index + 1 === nextPosition;
        button.setAttribute('aria-current', current ? 'true' : 'false');
        if (current) selectedItem = button;
      });
      if (changed && selectedItem) selectedItem.scrollIntoView({ block: 'nearest' });
    }

    document.addEventListener('keydown', event => {
      const key = event.key.toLowerCase();
      if (event.target.closest?.('button') && (key === 'enter' || key === ' ')) return;
      if (key === 'j' || key === 'arrowdown') send('next');
      else if (key === 'k' || key === 'arrowup') send('previous');
      else if (key === 'r' || key === 'enter') send('reload');
      else if (key === '+' || key === '=') zoomBy(1.15);
      else if (key === '-') zoomBy(1 / 1.15);
      else if (key === '0') setZoom(1);
      else if (key === 'f') setMode('fit');
      else if (key === 'q') send('close');
      else return;
      event.preventDefault();
    });

    function pointerPair() {
      const values = [...pointers.values()];
      if (values.length < 2) return null;
      const [first, second] = values;
      return {
        distance: Math.hypot(second.x - first.x, second.y - first.y),
        center: { x: (first.x + second.x) / 2, y: (first.y + second.y) / 2 },
      };
    }

    stage.addEventListener('wheel', event => {
      if (!event.ctrlKey && !event.metaKey) return;
      event.preventDefault();
      suppressClick = true;
      zoomBy(Math.exp(-event.deltaY * .01), { x: event.clientX, y: event.clientY });
      clearTimeout(stage.zoomClickTimer);
      stage.zoomClickTimer = setTimeout(() => { suppressClick = false; }, 120);
    }, { passive: false });

    stage.addEventListener('pointerdown', event => {
      pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      stage.setPointerCapture?.(event.pointerId);
      const pair = pointerPair();
      if (pair) {
        pinchDistance = pair.distance;
        swipeStart = null;
        dragStart = null;
        suppressClick = true;
      } else if (zoomMode === 'zoomed') {
        dragStart = {
          x: event.clientX, y: event.clientY,
          left: stage.scrollLeft, top: stage.scrollTop,
        };
      } else {
        swipeStart = { x: event.clientX, y: event.clientY };
      }
    });

    stage.addEventListener('pointermove', event => {
      if (!pointers.has(event.pointerId)) return;
      pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      const pair = pointerPair();
      if (pair && pinchDistance) {
        event.preventDefault();
        zoomBy(pair.distance / pinchDistance, pair.center);
        pinchDistance = pair.distance;
        suppressClick = true;
        return;
      }
      if (!dragStart || zoomMode !== 'zoomed') return;
      const dx = event.clientX - dragStart.x;
      const dy = event.clientY - dragStart.y;
      if (Math.abs(dx) + Math.abs(dy) > 3) {
        suppressClick = true;
        stage.classList.add('dragging');
      }
      stage.scrollLeft = dragStart.left - dx;
      stage.scrollTop = dragStart.top - dy;
    });

    function finishPointer(event, cancelled = false) {
      const start = swipeStart;
      pointers.delete(event.pointerId);
      if (pointers.size < 2) pinchDistance = 0;
      if (!pointers.size) {
        dragStart = null;
        swipeStart = null;
        stage.classList.remove('dragging');
      }
      if (!cancelled && start && zoomMode === 'fit' && !suppressClick) {
        const dx = event.clientX - start.x;
        const dy = event.clientY - start.y;
        if (Math.abs(dx) >= 50 && Math.abs(dx) >= Math.abs(dy) * 1.2) {
          suppressClick = true;
          send(dx < 0 ? 'next' : 'previous');
        }
      }
      if (!pointers.size && suppressClick) {
        setTimeout(() => { suppressClick = false; }, 0);
      }
    }

    stage.addEventListener('pointerup', event => finishPointer(event));
    stage.addEventListener('pointercancel', event => finishPointer(event, true));

    // Safari emits gesture events for trackpad pinch instead of ctrl+wheel.
    stage.addEventListener('gesturestart', event => {
      event.preventDefault();
      safariGestureZoom = currentZoom();
      suppressClick = true;
    }, { passive: false });
    stage.addEventListener('gesturechange', event => {
      event.preventDefault();
      setZoom(safariGestureZoom * event.scale, {
        x: event.clientX, y: event.clientY,
      });
    }, { passive: false });
    stage.addEventListener('gestureend', event => {
      event.preventDefault();
      setTimeout(() => { suppressClick = false; }, 0);
    }, { passive: false });

    async function refresh() {
      try {
        const response = await fetch('state.json', { cache: 'no-store' });
        const state = await response.json();
        document.getElementById('file').textContent = state.file;
        document.getElementById('frame').textContent = state.frame || '불러오는 중…';
        const names = state.frames || [];
        const nextFrameNamesKey = JSON.stringify(names);
        if (nextFrameNamesKey !== frameNamesKey) {
          frameNamesKey = nextFrameNamesKey;
          renderFrameList(names);
        }
        updateFrameSelection(state.position);
        position.textContent = state.count ? `${state.position} / ${state.count}` : '– / –';
        previous.disabled = state.position <= 1;
        next.disabled = !state.count || state.position >= state.count;
        document.title = `${state.frame || 'Pencil'} · preview`;
        if (state.ready && state.revision !== revision && loadingRevision === null) {
          const requestedRevision = state.revision;
          const imageKey = `${state.position}:${requestedRevision}`;
          loadingRevision = requestedRevision;
          requestedImageKey = imageKey;
          image.onload = () => {
            if (requestedImageKey !== imageKey) {
              loadingRevision = null;
              return;
            }
            revision = requestedRevision;
            loadingRevision = null;
            loading.hidden = true;
            image.hidden = false;
            baseWidth = image.naturalWidth / EXPORT_SCALE;
            baseHeight = image.naturalHeight / EXPORT_SCALE;
            if (zoomMode === 'zoomed') {
              image.style.width = `${baseWidth * zoom}px`;
              image.style.height = `${baseHeight * zoom}px`;
            } else {
              image.style.removeProperty('width');
              image.style.removeProperty('height');
            }
          };
          image.onerror = () => { loadingRevision = null; };
          image.src = `frame.png?v=${requestedRevision}`;
        } else if (!state.ready) {
          requestedImageKey = '';
          loadingRevision = null;
          image.hidden = true;
          loading.hidden = false;
          loading.textContent = '이미지 준비 중…';
        }
      } catch (_) {
        document.getElementById('frame').textContent = '미리보기 연결 끊김';
      }
    }
    refresh();
    setInterval(refresh, 150);
  </script>
</body>
</html>
