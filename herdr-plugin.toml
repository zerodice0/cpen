id = "zerodice0.cpen"
name = "cpen Pencil Session"
version = "0.7.0"
min_herdr_version = "0.7.5"
description = "Open Pencil desktop and an agent session tab."
platforms = ["macos", "linux"]

[[actions]]
id = "open"
title = "Open Pencil Session"
description = "Select a .pen file and agent, then open a session tab."
contexts = ["workspace", "pane"]
command = ["python3", "herdr/cpen_session.py", "open"]

[[events]]
on = "pane.closed"
command = ["python3", "herdr/cpen_session.py", "event"]

[[events]]
on = "pane.moved"
command = ["python3", "herdr/cpen_session.py", "event"]

[[panes]]
id = "launcher"
title = "Open Pencil Session"
placement = "popup"
width = 92
height = 30
command = ["python3", "herdr/cpen_session.py", "launcher"]
